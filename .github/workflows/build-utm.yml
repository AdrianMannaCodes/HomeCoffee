name: Build HomeCoffee.utm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Guest architecture'
        type: choice
        options: [aarch64, x86_64]
        default: aarch64
      disk_size_gb:
        description: 'Raw disk size (GB)'
        type: string
        default: '4'

concurrency:
  group: build-utm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      DISK_GB: ${{ inputs.disk_size_gb || '4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools and qemu-user emulation
        shell: bash
        run: |
          set -uo pipefail
          apt_retry() {
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=3 "$@" && return 0
              echo "apt-get $* failed (attempt $i), retrying in 10s"; sleep 10
            done
            return 1
          }
          apt_retry update || { echo '::error::apt-get update failed'; exit 1; }
          # Required everywhere: disk and filesystem tools, binfmt-support for binfmt registration.
          apt_retry install -y --no-install-recommends binfmt-support gdisk dosfstools e2fsprogs zip curl ca-certificates \
            || { echo '::error::apt-get install of base tools failed'; exit 1; }
          # qemu-user-static is not on every Ubuntu release; try it, but do not fail if absent.
          # The build script falls back to downloading the standalone static binary.
          if apt_retry install -y --no-install-recommends qemu-user-static; then
            echo 'installed qemu-user-static'
          else
            echo '::warning::qemu-user-static not available on this image; build script will use the standalone binary'
          fi
          # qemu-user-binfmt provides the binfmt config files; install it if available.
          apt_retry install -y --no-install-recommends qemu-user-binfmt || echo '::warning::qemu-user-binfmt not available'
          # Register binfmt handlers and report what is present.
          sudo update-binfmts --enable || true
          sudo systemctl restart binfmt-support || true
          command -v qemu-aarch64-static || command -v qemu-aarch64 || echo 'qemu-aarch64-static not on PATH yet; the build script will fetch it'
          ls /proc/sys/fs/binfmt_misc/ | grep -i -E 'qemu|aarch64' || echo 'no qemu binfmt entries listed'

      - name: Build disk image and bundle
        run: sudo -E ARCH="$ARCH" DISK_GB="$DISK_GB" bash scripts/build-utm.sh

      - name: Zip bundle
        run: |
          cd build
          zip -r -q HomeCoffee.utm.zip HomeCoffee.utm
          sha256sum HomeCoffee.utm.zip > HomeCoffee.utm.zip.sha256
          ls -lh HomeCoffee.utm.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCoffee-${{ env.ARCH }}
          path: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
          generate_release_notes: true

      - name: Publish rolling build release (main and manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest-${{ env.ARCH }}
          name: HomeCoffee build (${{ env.ARCH }}), latest
          prerelease: true
          body: |
            Automatically built from ${{ github.sha }} (${{ github.ref_name }}).
            This is a development build. Unzip HomeCoffee.utm.zip and open HomeCoffee.utm in UTM.
          files: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
