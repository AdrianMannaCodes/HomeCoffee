name: Build HomeCoffee.utm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Guest architecture'
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      disk_size_gb:
        description: 'Raw disk size (GB)'
        type: string
        default: '2'

concurrency:
  group: build-utm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'x86_64' }}
      DISK_GB: ${{ inputs.disk_size_gb || '2' }}
      RELEASE_TAG: nightly
      MAX_ZIP_MB: '150'
    steps:
      - name: Step 1 - checkout
        uses: actions/checkout@v4

      - name: Step 2 - install host tools
        shell: bash
        run: |
          set -uo pipefail
          echo "[workflow] arch=$ARCH disk=${DISK_GB}G host=$(uname -m)"
          apt_retry() {
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=3 "$@" && return 0
              echo "[workflow] apt-get $* failed (attempt $i), retrying in 10s"; sleep 10
            done
            return 1
          }
          echo "[workflow] apt-get update"
          apt_retry update || { echo '::error::apt-get update failed'; exit 1; }
          echo "[workflow] installing disk/filesystem tools"
          apt_retry install -y --no-install-recommends gdisk dosfstools e2fsprogs util-linux parted kpartx curl ca-certificates zip unzip \
            || { echo '::error::apt-get install of base tools failed'; exit 1; }
          if [ "$ARCH" = aarch64 ]; then
            echo "[workflow] aarch64 requested: installing qemu-user-static for emulation"
            apt_retry install -y --no-install-recommends qemu-user-static binfmt-support \
              || { echo '::error::apt-get install of qemu-user-static failed'; exit 1; }
            sudo update-binfmts --enable || true
            [ -x /usr/bin/qemu-aarch64-static ] || { echo '::error::/usr/bin/qemu-aarch64-static missing'; exit 1; }
          else
            echo "[workflow] native $ARCH build: qemu not needed, skipping"
          fi
          echo "[workflow] step 2 done"

      - name: Step 3 - build disk image and UTM bundle
        shell: bash
        run: |
          set -o pipefail
          echo "[workflow] running scripts/build-utm.sh as root"
          sudo -E ARCH="$ARCH" DISK_GB="$DISK_GB" bash scripts/build-utm.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "[workflow] build-utm.sh exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo '::group::Last 150 lines of build output'
            tail -n 150 build.log
            echo '::endgroup::'
            echo "::error::build-utm.sh exited with $rc"
          fi
          exit "$rc"

      - name: Step 4 - print failure log
        if: failure()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          tail -n 150 build.log || true

      - name: Step 5 - verify bundle
        shell: bash
        run: |
          set -e
          echo "[workflow] verifying bundle"
          test -f build/HomeCoffee.utm/config.plist
          test -f build/HomeCoffee.utm/Data/disk.img
          ls -lh build/HomeCoffee.utm build/HomeCoffee.utm/Data
          grep -E 'Target|Architecture|Display|Hardware|PS2Controller' build/HomeCoffee.utm/config.plist
          python3 -c "import plistlib; d=plistlib.load(open('build/HomeCoffee.utm/config.plist','rb')); assert d['ConfigurationVersion']==4; assert d['Backend']=='QEMU'; assert d['QEMU']['PS2Controller'] is True; [d[k] for k in ('Information','System','QEMU','Input','Sharing','Drive','Display','Network','Serial','Sound')]; print('config.plist keys OK')"
          echo "[workflow] bundle verified"

      - name: Step 5b - install QEMU and OVMF for headless boot check
        if: env.ARCH == 'x86_64'
        shell: bash
        run: |
          set -e
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86 ovmf
          command -v qemu-system-x86_64
          ls -l /usr/share/OVMF/ || true

      - name: Step 5c - headless QEMU boot sanity check (serial log, fail on panic or no login)
        if: env.ARCH == 'x86_64'
        shell: bash
        run: |
          set -uo pipefail
          BUNDLE=build/HomeCoffee.utm
          LOG=build/boot-serial.log
          rm -f "$LOG"
          # Firmware: pick the 4M variants when present, fail loudly if missing.
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          [ -f "$OVMF_CODE" ] || OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
          [ -f "$OVMF_CODE" ] || { echo '::error::OVMF_CODE firmware not found in /usr/share/OVMF'; exit 1; }
          OVMF_VARS_SRC=/usr/share/OVMF/OVMF_VARS_4M.fd
          [ -f "$OVMF_VARS_SRC" ] || OVMF_VARS_SRC=/usr/share/OVMF/OVMF_VARS.fd
          [ -f "$OVMF_VARS_SRC" ] || { echo '::error::OVMF_VARS firmware not found in /usr/share/OVMF'; exit 1; }
          # Writable vars copy; the disk is copied so the bundle stays untouched.
          cp "$OVMF_VARS_SRC" build/OVMF_VARS.fd || { echo '::error::could not copy OVMF vars'; exit 1; }
          cp "$BUNDLE/Data/disk.img" build/boot-test.img || { echo '::error::could not copy disk image'; exit 1; }
          # Use KVM when the runner exposes it; otherwise fall back to TCG (slower).
          ACCEL=tcg; CPU=max
          if [ -w /dev/kvm ]; then ACCEL=kvm; CPU=host; fi
          echo "[boot-check] accel=$ACCEL cpu=$CPU firmware=$OVMF_CODE"
          rc=0
          timeout 600 qemu-system-x86_64 \
            -machine q35,accel=$ACCEL -cpu $CPU -m 512 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive if=virtio,format=raw,file=build/boot-test.img \
            -device virtio-vga -device e1000,netdev=n0 -netdev user,id=n0 \
            -display none -no-reboot \
            -serial file:"$LOG" \
            -monitor none || rc=$?
          echo "[boot-check] qemu exit code: $rc (124 means the time limit was reached, which is expected for a running system)"
          echo "[boot-check] ===== last 120 lines of serial log ====="
          tail -n 120 "$LOG" 2>/dev/null || true
          if [ ! -s "$LOG" ]; then
            echo '::error::boot check produced an empty serial log (qemu may not have started)'; exit 1
          fi
          if grep -Eq 'Kernel panic|Attempted to kill init|VFS: Unable to mount root' "$LOG"; then
            echo '::error::boot check found a kernel panic or root mount failure'; exit 1
          fi
          if ! grep -Eq 'login:|homecoffee login' "$LOG"; then
            echo '::error::boot check did not reach a login prompt on ttyS0 within the time limit'; exit 1
          fi
          echo "[boot-check] PASS: system booted to a login prompt with no panic"

      - name: Step 5d - upload serial boot log (always, for diagnosis)
        if: always() && env.ARCH == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-log-${{ env.ARCH }}
          path: build/boot-serial.log
          if-no-files-found: warn
          retention-days: 7

      - name: Step 6 - package HomeCoffee-x86_64.utm.zip (max compression)
        shell: bash
        run: |
          set -e
          sudo chown -R "$(id -u):$(id -g)" build
          rm -f build/boot-test.img build/OVMF_VARS.fd
          cd build
          ZIP="HomeCoffee-${ARCH}.utm.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          zip -9 -r -q "$ZIP" HomeCoffee.utm
          sha256sum "$ZIP" > "$ZIP.sha256"
          SIZE_MB=$(( $(stat -c %s "$ZIP") / 1024 / 1024 ))
          echo "[workflow] $ZIP size: ${SIZE_MB} MB (soft limit ${MAX_ZIP_MB} MB)"
          unzip -l "$ZIP"
          if [ "$SIZE_MB" -gt "$MAX_ZIP_MB" ]; then
            echo "::warning::$ZIP is ${SIZE_MB} MB, over the ${MAX_ZIP_MB} MB soft limit"
          fi
          ls -lh "$ZIP" "$ZIP.sha256"

      - name: Step 7 - upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCoffee-${{ env.ARCH }}.utm.zip
          path: |
            build/HomeCoffee-${{ env.ARCH }}.utm.zip
            build/HomeCoffee-${{ env.ARCH }}.utm.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Step 8 - publish to nightly GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HomeCoffee nightly (${{ env.ARCH }})
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated build from commit ${{ github.sha }} (${{ github.ref_name }}).
            Download HomeCoffee-${{ env.ARCH }}.utm.zip, unzip it, and open HomeCoffee.utm in UTM.
            Settings: Q35, x86_64, UEFI, 512 MB RAM, 2 cores, VGA display, 2 GB virtio disk, PS/2 keyboard on.
            The desktop starts automatically on tty1. Full GUI desktop (Xorg, openbox, nodejs). This is a development build.
          files: |
            build/HomeCoffee-${{ env.ARCH }}.utm.zip
            build/HomeCoffee-${{ env.ARCH }}.utm.zip.sha256

      - name: Step 9 - upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.ARCH }}
          path: build.log
          retention-days: 7
