name: Build HomeCoffee.utm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Guest architecture'
        type: choice
        options: [aarch64, x86_64]
        default: aarch64
      disk_size_gb:
        description: 'Raw disk size (GB)'
        type: string
        default: '4'

concurrency:
  group: build-utm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      DISK_GB: ${{ inputs.disk_size_gb || '4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -uo pipefail
          apt_retry() {
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=3 "$@" && return 0
              echo "apt-get $* failed (attempt $i), retrying in 10s"; sleep 10
            done
            return 1
          }
          apt_retry update || { echo '::error::apt-get update failed'; exit 1; }
          # Ubuntu 26 (resolute) ships the qemu-user binaries in qemu-user-binfmt; qemu-user-static no longer exists.
          apt_retry install -y --no-install-recommends qemu-user-binfmt gdisk dosfstools e2fsprogs zip curl ca-certificates \
            || { echo '::error::apt-get install failed; see the lines above'; apt-cache policy qemu-user-binfmt gdisk dosfstools e2fsprogs zip | head -40; exit 1; }
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || echo 'no qemu binfmt entries yet (registered on first use)'

      - name: Build disk image and bundle
        run: sudo -E ARCH="$ARCH" DISK_GB="$DISK_GB" bash scripts/build-utm.sh

      - name: Zip bundle
        run: |
          cd build
          zip -r -q HomeCoffee.utm.zip HomeCoffee.utm
          sha256sum HomeCoffee.utm.zip > HomeCoffee.utm.zip.sha256
          ls -lh HomeCoffee.utm.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCoffee-${{ env.ARCH }}
          path: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
          generate_release_notes: true

      - name: Publish rolling build release (main and manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest-${{ env.ARCH }}
          name: HomeCoffee build (${{ env.ARCH }}), latest
          prerelease: true
          body: |
            Automatically built from ${{ github.sha }} (${{ github.ref_name }}).
            This is a development build. Unzip HomeCoffee.utm.zip and open HomeCoffee.utm in UTM.
          files: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
