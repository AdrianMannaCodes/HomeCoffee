name: Build HomeCoffee.utm

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'Guest architecture'
        type: choice
        options: [aarch64, x86_64]
        default: aarch64
      disk_size_gb:
        description: 'Raw disk size (GB)'
        type: string
        default: '4'

concurrency:
  group: build-utm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      DISK_GB: ${{ inputs.disk_size_gb || '4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools and qemu-user emulation
        shell: bash
        run: |
          set -uo pipefail
          apt_retry() {
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=3 "$@" && return 0
              echo "apt-get $* failed (attempt $i), retrying in 10s"; sleep 10
            done
            return 1
          }
          apt_retry update || { echo '::error::apt-get update failed'; exit 1; }
          apt_retry install -y --no-install-recommends binfmt-support gdisk dosfstools e2fsprogs zip curl ca-certificates util-linux parted kpartx \
            || { echo '::error::apt-get install of base tools failed'; exit 1; }
          # On ubuntu-24.04 this package provides /usr/bin/qemu-aarch64-static and registers binfmt.
          apt_retry install -y --no-install-recommends qemu-user-static \
            || { echo '::error::apt-get install of qemu-user-static failed'; exit 1; }
          sudo update-binfmts --enable || true
          if [ "$ARCH" = aarch64 ]; then
            [ -x /usr/bin/qemu-aarch64-static ] || { echo '::error::/usr/bin/qemu-aarch64-static missing after install'; exit 1; }
            echo "emulator: $(ls -l /usr/bin/qemu-aarch64-static)"
          fi
          ls /proc/sys/fs/binfmt_misc/ | grep -i -E 'qemu|aarch64' || echo 'no qemu binfmt entries listed'

      - name: Build disk image and bundle
        shell: bash
        run: |
          set -o pipefail
          sudo -E ARCH="$ARCH" DISK_GB="$DISK_GB" bash scripts/build-utm.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo '::group::Last 150 lines of build output'
            tail -n 150 build.log
            echo '::endgroup::'
            echo "::error::build-utm.sh exited with $rc"
          fi
          exit "$rc"

      - name: Print failure log
        if: failure()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          tail -n 150 build.log || true

      - name: Zip bundle
        run: |
          cd build
          zip -r -q HomeCoffee.utm.zip HomeCoffee.utm
          sha256sum HomeCoffee.utm.zip > HomeCoffee.utm.zip.sha256
          ls -lh HomeCoffee.utm.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCoffee-${{ env.ARCH }}
          path: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.ARCH }}
          path: build.log
          retention-days: 7

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
          generate_release_notes: true

      - name: Publish rolling build release (main and manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest-${{ env.ARCH }}
          name: HomeCoffee build (${{ env.ARCH }}), latest
          prerelease: true
          body: |
            Automatically built from ${{ github.sha }} (${{ github.ref_name }}).
            This is a development build. Unzip HomeCoffee.utm.zip and open HomeCoffee.utm in UTM.
          files: |
            build/HomeCoffee.utm.zip
            build/HomeCoffee.utm.zip.sha256
