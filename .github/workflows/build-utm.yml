name: Build HomeCoffee.utm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Guest architecture'
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      disk_size_gb:
        description: 'Raw disk size (GB)'
        type: string
        default: '4'

concurrency:
  group: build-utm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch || 'x86_64' }}
      DISK_GB: ${{ inputs.disk_size_gb || '4' }}
      RELEASE_TAG: nightly
    steps:
      - name: Step 1 - checkout
        uses: actions/checkout@v4

      - name: Step 2 - install host tools
        shell: bash
        run: |
          set -uo pipefail
          echo "[workflow] arch=$ARCH disk=${DISK_GB}G host=$(uname -m)"
          apt_retry() {
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=3 "$@" && return 0
              echo "[workflow] apt-get $* failed (attempt $i), retrying in 10s"; sleep 10
            done
            return 1
          }
          echo "[workflow] apt-get update"
          apt_retry update || { echo '::error::apt-get update failed'; exit 1; }
          echo "[workflow] installing disk/filesystem tools"
          apt_retry install -y --no-install-recommends gdisk dosfstools e2fsprogs util-linux parted kpartx curl ca-certificates \
            || { echo '::error::apt-get install of base tools failed'; exit 1; }
          if [ "$ARCH" = aarch64 ]; then
            echo "[workflow] aarch64 requested: installing qemu-user-static for emulation"
            apt_retry install -y --no-install-recommends qemu-user-static binfmt-support \
              || { echo '::error::apt-get install of qemu-user-static failed'; exit 1; }
            sudo update-binfmts --enable || true
            [ -x /usr/bin/qemu-aarch64-static ] || { echo '::error::/usr/bin/qemu-aarch64-static missing'; exit 1; }
          else
            echo "[workflow] native $ARCH build: qemu not needed, skipping"
          fi
          echo "[workflow] step 2 done"

      - name: Step 3 - build disk image and UTM bundle
        shell: bash
        run: |
          set -o pipefail
          echo "[workflow] running scripts/build-utm.sh as root"
          sudo -E ARCH="$ARCH" DISK_GB="$DISK_GB" bash scripts/build-utm.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "[workflow] build-utm.sh exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo '::group::Last 150 lines of build output'
            tail -n 150 build.log
            echo '::endgroup::'
            echo "::error::build-utm.sh exited with $rc"
          fi
          exit "$rc"

      - name: Step 4 - print failure log
        if: failure()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          tail -n 150 build.log || true

      - name: Step 5 - verify bundle
        shell: bash
        run: |
          set -e
          echo "[workflow] verifying bundle"
          test -f build/HomeCoffee.utm/config.plist
          test -f build/HomeCoffee.utm/Data/disk.img
          ls -lh build/HomeCoffee.utm build/HomeCoffee.utm/Data
          grep -E 'Target|Architecture|Displays|virtio-ramfb' build/HomeCoffee.utm/config.plist
          echo "[workflow] bundle verified"

      - name: Step 6 - package HomeCoffee-x86_64.utm.zip
        shell: bash
        run: |
          set -e
          # build/ is root-owned after the sudo build; give the runner user ownership before writing the zip.
          sudo chown -R "$(id -u):$(id -g)" build
          cd build
          ZIP="HomeCoffee-${ARCH}.utm.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          echo "[workflow] packaging $ZIP with python zipfile"
          python3 - "$ZIP" <<'PY'
          import os, sys, zipfile
          out = sys.argv[1]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, _dirs, files in os.walk('HomeCoffee.utm'):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, p)
          with zipfile.ZipFile(out) as z:
              names = z.namelist()
              print('entries:', names)
              assert 'HomeCoffee.utm/config.plist' in names, 'config.plist missing from zip'
              assert 'HomeCoffee.utm/Data/disk.img' in names, 'disk.img missing from zip'
          PY
          sha256sum "$ZIP" > "$ZIP.sha256"
          ls -lh "$ZIP" "$ZIP.sha256"
          cat "$ZIP.sha256"
          echo "[workflow] zip created"

      - name: Step 7 - upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCoffee-${{ env.ARCH }}.utm.zip
          path: |
            build/HomeCoffee-${{ env.ARCH }}.utm.zip
            build/HomeCoffee-${{ env.ARCH }}.utm.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Step 8 - publish to nightly GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HomeCoffee nightly (${{ env.ARCH }})
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated build from commit ${{ github.sha }} (${{ github.ref_name }}).
            Download HomeCoffee-${{ env.ARCH }}.utm.zip, unzip it, and open HomeCoffee.utm in UTM.
            Settings: Q35, x86_64, UEFI, 512 MB RAM, 2 cores, virtio-ramfb display.
            This is a development build.
          files: |
            build/HomeCoffee-${{ env.ARCH }}.utm.zip
            build/HomeCoffee-${{ env.ARCH }}.utm.zip.sha256

      - name: Step 9 - upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.ARCH }}
          path: build.log
          retention-days: 7
